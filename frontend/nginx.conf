server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An attached sketch is posted as a base64 data URL inside the JSON body,
    # which inflates the file by ~33% — and nginx's own default cap is 1m, well
    # under the backend's 8MB allowance. Without this an ordinary phone photo of
    # a whiteboard is rejected here and never reaches /ai/analyze-image at all.
    client_max_body_size 12m;

    # SSE stream — must not be buffered or nothing renders until the run ends.
    location /api/ai/agent/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The AI routes are model calls, not CRUD: reading an image and then
        # generating from it runs well past nginx's 60s default, which would
        # otherwise cut a working run off with a 504. Kept just above the LLM
        # client's own timeout so the model's error wins over the proxy's.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}