# Postgres only. The API and the web app run on your machine so you keep
# hot reload. `docker compose up -d` is all you need before migrating.
#
# Host port is overridable — e.g. on a box that already has something else
# on 5432, run `DIAGRAM_DB_PORT=5434 docker compose up -d db` (or set it in
# a local, untracked `.env` next to this file — Compose reads that
# automatically) instead of editing this file.
services:
  db:
    image: postgres:16-alpine
    container_name: diagram-db
    environment:
      POSTGRES_USER: diagram
      POSTGRES_PASSWORD: diagram
      POSTGRES_DB: diagram
    ports:
      - "${DIAGRAM_DB_PORT:-5432}:5432"
    volumes:
      - diagram-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagram -d diagram"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  diagram-pgdata:
